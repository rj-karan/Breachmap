version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: ["type:chore", "area:ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "pytest*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: ["type:chore", "area:ci", "security"]
    commit-message:
      prefix: "ci(deps)"
