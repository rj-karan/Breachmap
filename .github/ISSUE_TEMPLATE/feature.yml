name: Feature
description: Propose new capability. Check docs/design.md and the roadmap first.
title: "feat: <short description>"
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today, and who needs it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Fits which milestone
      options: ["M1", "M2", "M3", "M4", "M5", "M6", "Later"]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
